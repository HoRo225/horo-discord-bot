services:
  # 單一實例架構，不可 --scale bot=N：資料庫是 SQLite，檔案鎖無法跨容器，
  # 且背景結算迴圈沒有多 worker 的所有權機制，會重複發出結束公告。
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: horo:local
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    # healthcheck 只定義在 Dockerfile，image 本身就帶著它，docker run 也受保護。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # OpenAI 相容的 AI 閘道；bot 以服務名稱 ninerouter 走內部網路連線。
  # 服務名稱不用 9router，避免以數字開頭的 hostname 造成解析相容性問題。
  ninerouter:
    # 釘住版本與 digest：latest 會隨上游改版漂移，讓同一個 commit 重新部署
    # 拿到不同的 build。digest 是 multi-arch index，amd64/arm64 都適用。
    image: decolua/9router:0.5.45@sha256:b9c46bce1b16a0ec86a36ed3421c1d60111db394e2c164d4c0a21dcc835c44aa
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - ninerouter-data:/app/data
    # Docker 發布 port 會繞過 ufw，所以一定要指定綁定位址。
    # 預設只綁 localhost；要讓 tailnet 連進管理介面才在 .env 填 Tailscale IP。
    ports:
      - "${NINEROUTER_BIND_ADDR:-127.0.0.1}:20128:20128"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ninerouter-data:

